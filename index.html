<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos y Tarjetas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL de tu Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYdrWSghwQjTWqGbc2XdifFkFSMoDa-MRNKE_UyrdsuYFy-EeJ5T9d_EM0T_DPZ1yq/exec";

        const DEFAULT_STATE = {
            salary: 0,
            payDate: '',
            members: ['Yo (Principal)', 'Mi Señora'],
            cards: [
                { name: 'Visa Credito', isCredit: true },
                { name: 'Mastercard Credito', isCredit: true },
                { name: 'Débito / Efectivo', isCredit: false }
            ],
            categories: ['Impuestos', 'Servicios', 'Supermercado', 'Varios', 'Otros'],
            expenses: []
        };

        function App() {
            const [data, setData] = useState(DEFAULT_STATE);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);

            // Formulario nuevo gasto
            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [selectedCard, setSelectedCard] = useState('');
            const [selectedMember, setSelectedMember] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [totalInstallments, setTotalInstallments] = useState(1);
            const [isRecurring, setIsRecurring] = useState(false);

            // Formulario sueldo
            const [newSalary, setNewSalary] = useState('');
            const [newPayDate, setNewPayDate] = useState('');

            const [tab, setTab] = useState('summary');

            // Cargar datos desde Google Sheets al iniciar
            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(SCRIPT_URL);
                    const json = await res.json();
                    if (json) {
                        setData(prev => ({
                            ...prev,
                            salary: json.salary || 0,
                            payDate: json.payDate || '',
                            expenses: json.expenses || []
                        }));
                        if (json.cards?.length > 0 && !selectedCard) setSelectedCard(json.cards[0].name);
                        if (json.members?.length > 0 && !selectedMember) setSelectedMember(json.members[0]);
                        if (json.categories?.length > 0 && !selectedCategory) setSelectedCategory(json.categories[0]);
                    }
                } catch (err) {
                    console.error("Error cargando desde Google Sheets:", err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            // Guardar gasto en Google Sheets
            const handleAddExpense = async (e) => {
                e.preventDefault();
                if (!amount || Number(amount) <= 0) return;

                setSaving(true);
                const parsedInstallments = Number(totalInstallments);

                const newExp = {
                    id: Date.now().toString(),
                    amount: Number(amount),
                    description: description || selectedCategory,
                    card: selectedCard || data.cards[0]?.name,
                    member: selectedMember || data.members[0],
                    category: selectedCategory || data.categories[0],
                    currentInstallment: parsedInstallments > 1 ? 1 : 1,
                    totalInstallments: parsedInstallments > 1 ? parsedInstallments : 1,
                    isRecurring: selectedCategory === 'Impuestos' ? true : isRecurring,
                    date: new Date().toISOString().split('T')[0]
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "addExpense", expense: newExp })
                    });
                    
                    // Actualización local rápida
                    setData(prev => ({ ...prev, expenses: [newExp, ...prev.expenses] }));
                    setAmount('');
                    setDescription('');
                    setTotalInstallments(1);
                    setIsRecurring(false);
                } catch (err) {
                    alert("Error al guardar el gasto.");
                } finally {
                    setSaving(false);
                }
            };

            // Guardar Sueldo
            const handleSaveSalary = async (e) => {
                e.preventDefault();
                setSaving(true);
                const sal = Number(newSalary || data.salary);
                const date = newPayDate || data.payDate;

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "saveSalary", salary: sal, payDate: date })
                    });
                    setData(prev => ({ ...prev, salary: sal, payDate: date }));
                    alert("Sueldo y fecha actualizados.");
                } catch (err) {
                    alert("Error al guardar el sueldo.");
                } finally {
                    setSaving(false);
                }
            };

            // Eliminar Gasto
            const handleDeleteExpense = async (id) => {
                if (!window.confirm("¿Seguro que querés eliminar este gasto?")) return;
                setSaving(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "deleteExpense", id: id })
                    });
                    setData(prev => ({ ...prev, expenses: prev.expenses.filter(e => e.id !== id) }));
                } catch (err) {
                    alert("Error al eliminar.");
                } finally {
                    setSaving(false);
                }
            };

            // Arrancar Nuevo Mes
            const handleStartNewMonth = async () => {
                const msg = "¡Atención!\n\nAl arrancar un nuevo mes:\n- Las cuotas avanzarán 1 cuota (ej: 1 de 3 -> 2 de 3).\n- Cuotas terminadas (3 de 3) se borrarán.\n- Impuestos y Gastos Fijos se mantendrán.\n- Los gastos comunes de 1 pago se borrarán.\n\n¿Deseas continuar?";
                if (!window.confirm(msg)) return;

                setSaving(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "newMonth" })
                    });
                    alert("¡Nuevo mes iniciado con éxito!");
                    fetchData();
                } catch (err) {
                    alert("Error al renovar el mes.");
                } finally {
                    setSaving(false);
                }
            };

            // CÁLCULOS
            const primaryMember = data.members[0] || 'Yo (Principal)';

            // Gastos del usuario principal
            const primaryExpensesTotal = useMemo(() => {
                return data.expenses
                    .filter(e => e.member === primaryMember)
                    .reduce((sum, e) => sum + e.amount, 0);
            }, [data.expenses, primaryMember]);

            const remainingSalary = data.salary - primaryExpensesTotal;

            // Días restantes para cobrar
            const daysRemaining = useMemo(() => {
                if (!data.payDate) return 0;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(data.payDate);
                target.setHours(0, 0, 0, 0);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : 0;
            }, [data.payDate]);

            const dailyBudget = daysRemaining > 0 ? (remainingSalary / daysRemaining) : remainingSalary;

            // Resumen por Tarjetas (con Impuesto al Sello del 1.2% en tarjetas de crédito)
            const cardSummaries = useMemo(() => {
                return data.cards.map(cardObj => {
                    const cardName = cardObj.name;
                    const cardExpenses = data.expenses.filter(e => e.card === cardName);
                    const subtotal = cardExpenses.reduce((sum, e) => sum + e.amount, 0);
                    const taxStamp = cardObj.isCredit ? subtotal * 0.012 : 0;
                    const total = subtotal + taxStamp;

                    return {
                        name: cardName,
                        isCredit: cardObj.isCredit,
                        subtotal,
                        taxStamp,
                        total
                    };
                });
            }, [data.cards, data.expenses]);

            // Totales por integrante
            const totalsByMember = useMemo(() => {
                const map = {};
                data.members.forEach(m => map[m] = 0);
                data.expenses.forEach(e => {
                    map[e.member] = (map[e.member] || 0) + e.amount;
                });
                return map;
            }, [data.members, data.expenses]);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto mb-4"></div>
                            <p className="text-sm font-medium">Cargando datos desde Google Sheets...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 pb-20 font-sans text-slate-800">
                    {/* Header */}
                    <header className="mb-6 flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
                        <div>
                            <h1 className="text-xl font-bold text-slate-900">Gestor de Gastos y Tarjetas</h1>
                            <p className="text-xs text-slate-500">Conectado a tu Google Sheets en tiempo real</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={fetchData} 
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition"
                            >
                                🔄 Actualizar
                            </button>
                            <button 
                                onClick={handleStartNewMonth}
                                className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-sm"
                            >
                                📅 Arrancar Nuevo Mes
                            </button>
                        </div>
                    </header>

                    {/* Métrica Sueldo y Presupuesto Diario */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div className="bg-emerald-600 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Saldo Restante (Tu Sueldo)</span>
                            <div className="text-3xl font-extrabold mt-1">${remainingSalary.toLocaleString('es-AR')}</div>
                            <span className="text-xs opacity-75 mt-2 block">Sueldo Base: ${data.salary.toLocaleString('es-AR')}</span>
                        </div>

                        <div className="bg-indigo-600 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Disponible por Día</span>
                            <div className="text-3xl font-extrabold mt-1">
                                ${dailyBudget > 0 ? dailyBudget.toLocaleString('es-AR', { maximumFractionDigits: 0 }) : 0} /día
                            </div>
                            <span className="text-xs opacity-75 mt-2 block">
                                {daysRemaining > 0 ? `Faltan ${daysRemaining} días para cobrar` : 'Configurá fecha de cobro'}
                            </span>
                        </div>

                        <div className="bg-slate-800 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Total Tarjetas + Imp. Sello</span>
                            <div className="text-3xl font-extrabold mt-1">
                                ${cardSummaries.reduce((acc, c) => acc + c.total, 0).toLocaleString('es-AR', { maximumFractionDigits: 0 })}
                            </div>
                            <span className="text-xs text-slate-400 mt-2 block">Incluye 1,2% Impuesto al Sello</span>
                        </div>
                    </div>

                    {/* Formulario Cargar Gasto */}
                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <h2 className="text-sm font-bold uppercase tracking-wider text-slate-700 mb-4">Cargar Nuevo Gasto</h2>
                        <form onSubmit={handleAddExpense} className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Monto ($)</label>
                                <input 
                                    type="number" 
                                    required 
                                    placeholder="ej: 25000"
                                    value={amount} 
                                    onChange={e => setAmount(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">¿Quién compró?</label>
                                <select 
                                    value={selectedMember} 
                                    onChange={e => setSelectedMember(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                                >
                                    {data.members.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Tarjeta / Medio</label>
                                <select 
                                    value={selectedCard} 
                                    onChange={e => setSelectedCard(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                                >
                                    {data.cards.map(c => <option key={c.name} value={c.name}>{c.name} {c.isCredit ? '(Crédito)' : ''}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Categoría</label>
                                <select 
                                    value={selectedCategory} 
                                    onChange={e => setSelectedCategory(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                                >
                                    {data.categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Detalle / Comercio</label>
                                <input 
                                    type="text" 
                                    placeholder="ej: ARBA / Supermercado"
                                    value={description} 
                                    onChange={e => setDescription(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Cuotas totales</label>
                                <input 
                                    type="number" 
                                    min="1"
                                    max="60"
                                    value={totalInstallments} 
                                    onChange={e => setTotalInstallments(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            {selectedCategory !== 'Impuestos' && (
                                <div className="md:col-span-2 flex items-center gap-2 pt-2">
                                    <input 
                                        type="checkbox" 
                                        id="isRecurring"
                                        checked={isRecurring}
                                        onChange={e => setIsRecurring(e.target.checked)}
                                        className="w-4 h-4 text-indigo-600 rounded"
                                    />
                                    <label htmlFor="isRecurring" className="text-xs text-slate-600">
                                        Gasto Fijo mensual (se mantiene todos los meses al renovar)
                                    </label>
                                </div>
                            )}

                            <div className="md:col-span-3 mt-2">
                                <button 
                                    type="submit" 
                                    disabled={saving}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-sm disabled:opacity-50"
                                >
                                    {saving ? 'Guardando...' : '+ Registrar Gasto'}
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Solapas */}
                    <div className="flex border-b border-slate-200 mb-6 bg-white rounded-t-xl px-2">
                        <button 
                            onClick={() => setTab('summary')}
                            className={`py-3 px-4 font-semibold text-sm border-b-2 transition ${tab === 'summary' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'}`}
                        >
                            💳 Resumen Home Banking
                        </button>
                        <button 
                            onClick={() => setTab('expenses')}
                            className={`py-3 px-4 font-semibold text-sm border-b-2 transition ${tab === 'expenses' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'}`}
                        >
                            📋 Historial ({data.expenses.length})
                        </button>
                        <button 
                            onClick={() => setTab('settings')}
                            className={`py-3 px-4 font-semibold text-sm border-b-2 transition ${tab === 'settings' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500'}`}
                        >
                            ⚙️ Ajustes de Sueldo
                        </button>
                    </div>

                    {/* TAB: RESUMEN HOME BANKING */}
                    {tab === 'summary' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Tarjetas */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-1">💳 Totales por Tarjeta a Pagar</h3>
                                <p className="text-xs text-slate-500 mb-4">Sumado automáticamente el 1,2% del Impuesto al Sello en Crédito.</p>
                                <div className="space-y-4">
                                    {cardSummaries.map(card => (
                                        <div key={card.name} className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-slate-800">{card.name}</span>
                                                <span className="font-extrabold text-slate-900 text-lg">${card.total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span>
                                            </div>
                                            {card.isCredit && (
                                                <div className="text-[11px] text-slate-500 flex justify-between pt-2 border-t border-slate-200">
                                                    <span>Consumos: ${card.subtotal.toLocaleString('es-AR')}</span>
                                                    <span className="text-amber-700 font-medium">+ Imp. Sello (1,2%): ${card.taxStamp.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Consumo por Integrante */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-1">👥 Consumo por Integrante</h3>
                                <p className="text-xs text-slate-500 mb-4">Para saber cuánto debe poner o transferir cada uno.</p>
                                <div className="space-y-3">
                                    {Object.entries(totalsByMember).map(([memberName, total]) => {
                                        const isPrimary = memberName === primaryMember;
                                        return (
                                            <div key={memberName} className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-slate-800 text-sm">{memberName}</div>
                                                    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${isPrimary ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-800'}`}>
                                                        {isPrimary ? 'Descuenta del Sueldo' : 'No descuenta del Sueldo'}
                                                    </span>
                                                </div>
                                                <span className="font-bold text-slate-900 text-base">${total.toLocaleString('es-AR')}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB: HISTORIAL */}
                    {tab === 'expenses' && (
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            {data.expenses.length === 0 ? (
                                <div className="p-8 text-center text-slate-400 text-sm">No hay gastos guardados aún.</div>
                            ) : (
                                <div className="divide-y divide-slate-100">
                                    {data.expenses.map(item => (
                                        <div key={item.id} className="p-4 flex justify-between items-center hover:bg-slate-50 transition">
                                            <div>
                                                <div className="font-semibold text-slate-800 text-sm">{item.description}</div>
                                                <div className="flex flex-wrap gap-2 mt-1 items-center">
                                                    <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{item.card}</span>
                                                    <span className="text-[11px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">{item.member}</span>
                                                    <span className="text-[11px] bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded">{item.category}</span>
                                                    {item.totalInstallments > 1 && (
                                                        <span className="text-[11px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">
                                                            Cuota {item.currentInstallment} de {item.totalInstallments}
                                                        </span>
                                                    )}
                                                    {(item.isRecurring || item.category === 'Impuestos') && (
                                                        <span className="text-[11px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">
                                                            Fijo / Recurrente
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <span className="font-bold text-slate-900">${item.amount.toLocaleString('es-AR')}</span>
                                                <button 
                                                    onClick={() => handleDeleteExpense(item.id)}
                                                    className="text-slate-300 hover:text-red-600 font-bold px-2 py-1 text-sm"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* TAB: AJUSTES */}
                    {tab === 'settings' && (
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">Configurar Sueldo y Cobro</h3>
                            <form onSubmit={handleSaveSalary} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Monto de Sueldo ($)</label>
                                    <input 
                                        type="number" 
                                        placeholder={data.salary}
                                        value={newSalary} 
                                        onChange={e => setNewSalary(e.target.value)}
                                        className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Próxima Fecha de Cobro</label>
                                    <input 
                                        type="date" 
                                        value={newPayDate || data.payDate} 
                                        onChange={e => setNewPayDate(e.target.value)}
                                        className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                    />
                                </div>
                                <div className="flex items-end">
                                    <button 
                                        type="submit" 
                                        disabled={saving}
                                        className="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 px-4 rounded-lg text-sm disabled:opacity-50"
                                    >
                                        {saving ? 'Guardando...' : 'Guardar Cambios'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

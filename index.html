<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos y Tarjetas</title>

    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gastos Hogar">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">

    <script>
        const manifest = {
            "name": "Gestor de Gastos y Tarjetas",
            "short_name": "Gastos",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#4f46e5",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/2382/2382461.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.getElementsByTagName('head')[0].appendChild(link);
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYdrWSghwQjTWqGbc2XdifFkFSMoDa-MRNKE_UyrdsuYFy-EeJ5T9d_EM0T_DPZ1yq/exec";

        const DEFAULT_STATE = {
            salary: 0,
            payDate: '',
            members: ['Yo (Principal)', 'Mi Señora'],
            cards: [
                { name: 'Visa Credito', isCredit: true },
                { name: 'Mastercard Credito', isCredit: true }
            ],
            expenses: []
        };

        function App() {
            const [data, setData] = useState(DEFAULT_STATE);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const [activeView, setActiveView] = useState('summary');
            const [searchTerm, setSearchTerm] = useState('');

            // Formulario carga / edición
            const [editingId, setEditingId] = useState(null);
            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [selectedMember, setSelectedMember] = useState('');
            const [expenseDate, setExpenseDate] = useState(new Date().toISOString().split('T')[0]);
            const [isInstallment, setIsInstallment] = useState(false);
            const [totalInstallments, setTotalInstallments] = useState(3);
            const [currentInstallment, setCurrentInstallment] = useState(1);
            const [isRecurring, setIsRecurring] = useState(false);

            // Ajustes
            const [newSalary, setNewSalary] = useState('');
            const [newPayDate, setNewPayDate] = useState('');
            const [newMemberName, setNewMemberName] = useState('');
            const [newCardName, setNewCardName] = useState('');
            const [newCardIsCredit, setNewCardIsCredit] = useState(true);

            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) {
                    alert("Para instalar en iPhone: Tocá el botón 'Compartir' en Safari y elegí 'Agregar a Inicio'.\n\nEn Android: Tocá los 3 puntos de Chrome y elegí 'Agregar a pantalla principal' o 'Instalar aplicación'.");
                    return;
                }
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                setDeferredPrompt(null);
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(SCRIPT_URL);
                    const json = await res.json();
                    if (json) {
                        setData(prev => ({
                            ...prev,
                            salary: json.salary !== undefined ? json.salary : prev.salary,
                            payDate: json.payDate || prev.payDate,
                            members: json.members?.length > 0 ? json.members : prev.members,
                            cards: json.cards?.length > 0 ? json.cards : prev.cards,
                            expenses: json.expenses || []
                        }));
                        if (json.members?.length > 0 && !selectedMember) setSelectedMember(json.members[0]);
                        if (json.salary) setNewSalary(json.salary);
                        if (json.payDate) setNewPayDate(json.payDate);
                    }
                } catch (err) {
                    console.error("Error cargando:", err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            const saveSettingsToCloud = async (updatedData) => {
                setSaving(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: "saveSettings",
                            salary: updatedData.salary,
                            payDate: updatedData.payDate,
                            members: updatedData.members,
                            cards: updatedData.cards
                        })
                    });
                    setData(updatedData);
                    alert("¡Configuración guardada!");
                } catch (err) {
                    alert("Error al guardar.");
                } finally {
                    setSaving(false);
                }
            };

            const handleAddOrUpdateExpense = async (e) => {
                e.preventDefault();
                if (!amount || Number(amount) <= 0) return;

                setSaving(true);
                const parsedInstallments = isInstallment ? Number(totalInstallments) : 1;

                const expenseData = {
                    id: editingId ? editingId : Date.now().toString(),
                    amount: Number(amount),
                    description: description || activeView,
                    member: selectedMember || data.members[0],
                    section: activeView,
                    currentInstallment: editingId ? currentInstallment : (parsedInstallments > 1 ? 1 : 1),
                    totalInstallments: parsedInstallments > 1 ? parsedInstallments : 1,
                    isRecurring: activeView === 'Impuestos' ? true : isRecurring,
                    date: expenseDate || new Date().toISOString().split('T')[0]
                };

                const actionType = editingId ? "editExpense" : "addExpense";

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: actionType, expense: expenseData })
                    });
                    
                    if (editingId) {
                        setData(prev => ({
                            ...prev,
                            expenses: prev.expenses.map(ex => ex.id === editingId ? expenseData : ex)
                        }));
                        setEditingId(null);
                    } else {
                        setData(prev => ({ ...prev, expenses: [expenseData, ...prev.expenses] }));
                    }

                    setAmount('');
                    setDescription('');
                    setIsInstallment(false);
                    setTotalInstallments(3);
                    setCurrentInstallment(1);
                    setIsRecurring(false);
                    setExpenseDate(new Date().toISOString().split('T')[0]);
                } catch (err) {
                    alert("Error al guardar el movimiento.");
                } finally {
                    setSaving(false);
                }
            };

            const handleStartEdit = (item) => {
                setEditingId(item.id);
                setAmount(item.amount);
                setDescription(item.description);
                setSelectedMember(item.member);
                setExpenseDate(item.date);
                if (item.totalInstallments > 1) {
                    setIsInstallment(true);
                    setTotalInstallments(item.totalInstallments);
                    setCurrentInstallment(item.currentInstallment);
                } else {
                    setIsInstallment(false);
                    setTotalInstallments(3);
                    setCurrentInstallment(1);
                }
                setIsRecurring(item.isRecurring);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setAmount('');
                setDescription('');
                setIsInstallment(false);
                setTotalInstallments(3);
                setCurrentInstallment(1);
                setIsRecurring(false);
                setExpenseDate(new Date().toISOString().split('T')[0]);
            };

            const handleDeleteExpense = async (id, desc) => {
                if (!window.confirm(`¿Estás seguro de que querés eliminar "${desc || 'este movimiento'}"?`)) return;
                setSaving(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "deleteExpense", id: id })
                    });
                    setData(prev => ({ ...prev, expenses: prev.expenses.filter(e => e.id !== id) }));
                    if (editingId === id) handleCancelEdit();
                } catch (err) {
                    alert("Error al eliminar.");
                } finally {
                    setSaving(false);
                }
            };

            const handleStartNewMonth = async () => {
                const msg = "¡Atención!\n\nAl arrancar un nuevo mes:\n- Las cuotas avanzarán 1 cuota (ej: 1 de 3 -> 2 de 3).\n- Cuotas terminadas se borrarán.\n- Impuestos y Gastos Fijos se mantendrán.\n- Los gastos comunes de 1 pago se borrarán.\n\n¿Deseas continuar?";
                if (!window.confirm(msg)) return;

                setSaving(true);
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "newMonth" })
                    });
                    alert("¡Nuevo mes iniciado con éxito!");
                    fetchData();
                } catch (err) {
                    alert("Error al renovar el mes.");
                } finally {
                    setSaving(false);
                }
            };

            const handleSaveSalaryForm = (e) => {
                e.preventDefault();
                saveSettingsToCloud({
                    ...data,
                    salary: Number(newSalary !== '' ? newSalary : data.salary),
                    payDate: newPayDate || data.payDate
                });
            };

            const handleAddMember = (e) => {
                e.preventDefault();
                if (!newMemberName.trim() || data.members.includes(newMemberName.trim())) return;
                saveSettingsToCloud({ ...data, members: [...data.members, newMemberName.trim()] });
                setNewMemberName('');
            };

            const handleRemoveMember = (name) => {
                if (data.members.length <= 1) {
                    alert("Debe haber al menos un integrante.");
                    return;
                }
                saveSettingsToCloud({ ...data, members: data.members.filter(m => m !== name) });
            };

            const handleAddCard = (e) => {
                e.preventDefault();
                if (!newCardName.trim() || data.cards.some(c => c.name === newCardName.trim())) return;
                saveSettingsToCloud({ ...data, cards: [...data.cards, { name: newCardName.trim(), isCredit: newCardIsCredit }] });
                setNewCardName('');
            };

            const handleRemoveCard = (name) => {
                if (data.cards.length <= 1) {
                    alert("Debe haber al menos una tarjeta.");
                    return;
                }
                saveSettingsToCloud({ ...data, cards: data.cards.filter(c => c.name !== name) });
            };

            // CÁLCULOS
            const primaryMember = data.members[0] || 'Yo (Principal)';

            const primaryExpensesTotal = useMemo(() => {
                return data.expenses
                    .filter(e => e.member === primaryMember)
                    .reduce((sum, e) => sum + e.amount, 0);
            }, [data.expenses, primaryMember]);

            const remainingSalary = data.salary - primaryExpensesTotal;

            const daysRemaining = useMemo(() => {
                if (!data.payDate) return 0;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(data.payDate);
                target.setHours(0, 0, 0, 0);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : 0;
            }, [data.payDate]);

            const dailyBudget = daysRemaining > 0 ? (remainingSalary / daysRemaining) : remainingSalary;

            const cardSummaries = useMemo(() => {
                return data.cards.map(cardObj => {
                    const cardName = cardObj.name;
                    const cardExpenses = data.expenses.filter(e => e.section === cardName);
                    const subtotal = cardExpenses.reduce((sum, e) => sum + e.amount, 0);
                    const taxStamp = cardObj.isCredit ? subtotal * 0.012 : 0;
                    const total = subtotal + taxStamp;

                    return {
                        name: cardName,
                        isCredit: cardObj.isCredit,
                        subtotal,
                        taxStamp,
                        total,
                        count: cardExpenses.length
                    };
                });
            }, [data.cards, data.expenses]);

            const impuestosTotal = useMemo(() => {
                return data.expenses.filter(e => e.section === 'Impuestos').reduce((sum, e) => sum + e.amount, 0);
            }, [data.expenses]);

            const otrosTotal = useMemo(() => {
                return data.expenses.filter(e => e.section === 'Otros').reduce((sum, e) => sum + e.amount, 0);
            }, [data.expenses]);

            // TOTAL GENERAL CORRECTO (Suma Tarjetas + Impuestos + Otros sin duplicar)
            const totalGeneralGastos = useMemo(() => {
                const cardsTotalSum = cardSummaries.reduce((acc, c) => acc + c.total, 0);
                return cardsTotalSum + impuestosTotal + otrosTotal;
            }, [cardSummaries, impuestosTotal, otrosTotal]);

            const totalsByMember = useMemo(() => {
                const map = {};
                data.members.forEach(m => map[m] = 0);
                data.expenses.forEach(e => {
                    map[e.member] = (map[e.member] || 0) + e.amount;
                });
                return map;
            }, [data.members, data.expenses]);

            // Filtrado dinámico de movimientos
            const filteredExpenses = useMemo(() => {
                let list = data.expenses;
                if (activeView !== 'summary' && activeView !== 'settings') {
                    list = list.filter(e => e.section === activeView);
                }
                if (!searchTerm.trim()) return list;
                const term = searchTerm.toLowerCase();
                return list.filter(item => 
                    item.description.toLowerCase().includes(term) ||
                    item.member.toLowerCase().includes(term) ||
                    item.section.toLowerCase().includes(term) ||
                    String(item.amount).includes(term) ||
                    item.date.includes(term)
                );
            }, [data.expenses, activeView, searchTerm]);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white font-sans">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto mb-4"></div>
                            <p className="text-sm font-medium">Cargando gastos...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 pb-20 font-sans text-slate-800">
                    {/* Header */}
                    <header className="mb-6 flex flex-wrap justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
                        <div>
                            <h1 className="text-xl font-bold text-slate-900">Gestor de Gastos y Tarjetas</h1>
                            <p className="text-xs text-slate-500">Sincronizado con Google Sheets</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button 
                                onClick={handleInstallApp} 
                                className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm flex items-center gap-1"
                            >
                                📱 Instalar App
                            </button>
                            <button 
                                onClick={fetchData} 
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition"
                            >
                                🔄 Actualizar
                            </button>
                            <button 
                                onClick={handleStartNewMonth}
                                className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-sm"
                            >
                                📅 Arrancar Nuevo Mes
                            </button>
                        </div>
                    </header>

                    {/* Métrica Sueldo y Presupuesto Diario */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div className="bg-emerald-600 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Saldo Restante (Tu Sueldo)</span>
                            <div className="text-3xl font-extrabold mt-1">${remainingSalary.toLocaleString('es-AR')}</div>
                            <span className="text-xs opacity-75 mt-2 block">Sueldo Base: ${data.salary.toLocaleString('es-AR')}</span>
                        </div>

                        <div className="bg-indigo-600 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Disponible por Día</span>
                            <div className="text-3xl font-extrabold mt-1">
                                ${dailyBudget > 0 ? dailyBudget.toLocaleString('es-AR', { maximumFractionDigits: 0 }) : 0} /día
                            </div>
                            <span className="text-xs opacity-75 mt-2 block">
                                {daysRemaining > 0 ? `Faltan ${daysRemaining} días para cobrar` : 'Configurá fecha de cobro'}
                            </span>
                        </div>

                        <div className="bg-slate-800 text-white p-5 rounded-xl shadow">
                            <span className="text-xs font-semibold uppercase tracking-wider opacity-80">Total General Gastos</span>
                            <div className="text-3xl font-extrabold mt-1">
                                ${totalGeneralGastos.toLocaleString('es-AR', { maximumFractionDigits: 0 })}
                            </div>
                            <span className="text-xs text-slate-400 mt-2 block">Tarjetas + Impuestos + Otros</span>
                        </div>
                    </div>

                    {/* Botones de Navegación con Totales con/sin Impuesto */}
                    <div className="mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Secciones y Tarjetas</h3>
                        <div className="flex flex-wrap gap-2">
                            <button 
                                onClick={() => { setActiveView('summary'); handleCancelEdit(); setSearchTerm(''); }}
                                className={`px-4 py-2.5 rounded-lg font-bold text-sm transition ${activeView === 'summary' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                📊 Resumen General
                            </button>

                            {data.cards.map(c => {
                                const cardInfo = cardSummaries.find(cs => cs.name === c.name) || { total: 0, subtotal: 0 };
                                const isSelected = activeView === c.name;
                                return (
                                    <button 
                                        key={c.name}
                                        onClick={() => { setActiveView(c.name); handleCancelEdit(); setSearchTerm(''); }}
                                        className={`px-3 py-2 rounded-lg font-bold text-xs md:text-sm transition flex flex-col items-start ${isSelected ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                    >
                                        <div className="flex items-center gap-1.5">
                                            <span>💳 {c.name}</span>
                                        </div>
                                        <div className="mt-1 flex items-center gap-1 text-[11px]">
                                            <span className="font-extrabold">${cardInfo.total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span>
                                            <span className={`opacity-80 text-[10px] ${isSelected ? 'text-indigo-200' : 'text-slate-500'}`}>
                                                (sub: ${cardInfo.subtotal.toLocaleString('es-AR', { maximumFractionDigits: 0 })})
                                            </span>
                                        </div>
                                    </button>
                                );
                            })}

                            <button 
                                onClick={() => { setActiveView('Impuestos'); handleCancelEdit(); setSearchTerm(''); }}
                                className={`px-4 py-2.5 rounded-lg font-bold text-sm transition flex items-center gap-2 ${activeView === 'Impuestos' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                <span>🏛️ Impuestos</span>
                                <span className={`text-xs px-2 py-0.5 rounded-full ${activeView === 'Impuestos' ? 'bg-indigo-700 text-white' : 'bg-slate-200 text-slate-800'}`}>
                                    ${impuestosTotal.toLocaleString('es-AR', { maximumFractionDigits: 0 })}
                                </span>
                            </button>

                            <button 
                                onClick={() => { setActiveView('Otros'); handleCancelEdit(); setSearchTerm(''); }}
                                className={`px-4 py-2.5 rounded-lg font-bold text-sm transition flex items-center gap-2 ${activeView === 'Otros' ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                <span>📂 Otros</span>
                                <span className={`text-xs px-2 py-0.5 rounded-full ${activeView === 'Otros' ? 'bg-indigo-700 text-white' : 'bg-slate-200 text-slate-800'}`}>
                                    ${otrosTotal.toLocaleString('es-AR', { maximumFractionDigits: 0 })}
                                </span>
                            </button>

                            <button 
                                onClick={() => { setActiveView('settings'); handleCancelEdit(); setSearchTerm(''); }}
                                className={`px-4 py-2.5 rounded-lg font-bold text-sm transition ${activeView === 'settings' ? 'bg-slate-800 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                            >
                                ⚙️ Ajustes / Tarjetas
                            </button>
                        </div>
                    </div>

                    {/* VISTA: RESUMEN GENERAL */}
                    {activeView === 'summary' && (
                        <div className="space-y-6">
                            {/* Buscador General en Resumen */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <label className="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">🔍 Buscar en todos los movimientos</label>
                                <input 
                                    type="text" 
                                    placeholder="Buscar por detalle, tarjeta, integrante, monto o fecha..." 
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            {searchTerm.trim() ? (
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200 font-bold text-sm text-slate-700">
                                        Resultados de búsqueda ({filteredExpenses.length})
                                    </div>
                                    {filteredExpenses.length === 0 ? (
                                        <div className="p-8 text-center text-slate-400 text-sm">No se encontraron movimientos.</div>
                                    ) : (
                                        <div className="divide-y divide-slate-100">
                                            {filteredExpenses.map(item => (
                                                <div key={item.id} className="p-4 flex flex-wrap justify-between items-center gap-3 hover:bg-slate-50 transition">
                                                    <div>
                                                        <div className="font-semibold text-slate-800 text-sm">{item.description}</div>
                                                        <div className="flex flex-wrap gap-2 mt-1 items-center">
                                                            <span className="text-[11px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold">{item.section}</span>
                                                            <span className="text-[11px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-medium">{item.member}</span>
                                                            <span className="text-[11px] text-slate-400">{item.date}</span>
                                                            {item.totalInstallments > 1 && (
                                                                <span className="text-[11px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">
                                                                    Cuota {item.currentInstallment} de {item.totalInstallments}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <div className="font-bold text-slate-900 text-base">${item.amount.toLocaleString('es-AR')}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 mb-1">💳 Totales por Tarjeta a Pagar</h3>
                                        <p className="text-xs text-slate-500 mb-4">Incluye 1,2% Impuesto al Sello en Crédito.</p>
                                        <div className="space-y-4">
                                            {cardSummaries.map(card => (
                                                <div key={card.name} onClick={() => setActiveView(card.name)} className="p-3 bg-slate-50 hover:bg-slate-100 cursor-pointer rounded-lg border border-slate-200 transition">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="font-bold text-slate-800">{card.name}</span>
                                                        <span className="font-extrabold text-slate-900 text-lg">${card.total.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span>
                                                    </div>
                                                    {card.isCredit && (
                                                        <div className="text-[11px] text-slate-500 flex justify-between pt-2 border-t border-slate-200">
                                                            <span>Consumos: ${card.subtotal.toLocaleString('es-AR')}</span>
                                                            <span className="text-amber-700 font-medium">+ Imp. Sello (1,2%): ${card.taxStamp.toLocaleString('es-AR', { maximumFractionDigits: 0 })}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                            <div onClick={() => setActiveView('Impuestos')} className="p-3 bg-slate-50 hover:bg-slate-100 cursor-pointer rounded-lg border border-slate-200 flex justify-between items-center transition">
                                                <span className="font-bold text-slate-800">🏛️ Impuestos</span>
                                                <span className="font-bold text-slate-900">${impuestosTotal.toLocaleString('es-AR')}</span>
                                            </div>
                                            <div onClick={() => setActiveView('Otros')} className="p-3 bg-slate-50 hover:bg-slate-100 cursor-pointer rounded-lg border border-slate-200 flex justify-between items-center transition">
                                                <span className="font-bold text-slate-800">📂 Otros</span>
                                                <span className="font-bold text-slate-900">${otrosTotal.toLocaleString('es-AR')}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-800 mb-1">👥 Consumo por Integrante</h3>
                                        <p className="text-xs text-slate-500 mb-4">Para saber cuánto debe aportar cada integrante.</p>
                                        <div className="space-y-3">
                                            {Object.entries(totalsByMember).map(([memberName, total]) => {
                                                const isPrimary = memberName === primaryMember;
                                                return (
                                                    <div key={memberName} className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center">
                                                        <div>
                                                            <div className="font-bold text-slate-800 text-sm">{memberName}</div>
                                                            <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${isPrimary ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-800'}`}>
                                                                {isPrimary ? 'Descuenta del Sueldo' : 'No descuenta del Sueldo'}
                                                            </span>
                                                        </div>
                                                        <span className="font-bold text-slate-900 text-base">${total.toLocaleString('es-AR')}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* VISTA: SECCIÓN ESPECÍFICA (Tarjeta, Impuestos u Otros) */}
                    {activeView !== 'summary' && activeView !== 'settings' && (
                        <div className="space-y-6">
                            {/* Formulario Cargar / Editar Gasto */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-indigo-600">
                                        {editingId ? `✏️ Editando movimiento en: ` : `➕ Cargar Gasto en: `} <span className="underline">{activeView}</span>
                                    </h3>
                                    {editingId && (
                                        <button onClick={handleCancelEdit} className="text-xs bg-slate-200 hover:bg-slate-300 px-2.5 py-1 rounded font-semibold text-slate-700">
                                            Cancelar Edición
                                        </button>
                                    )}
                                </div>
                                <form onSubmit={handleAddOrUpdateExpense} className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Monto ($)</label>
                                        <input 
                                            type="number" 
                                            required 
                                            placeholder="ej: 15000"
                                            value={amount} 
                                            onChange={e => setAmount(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">¿Quién hizo la compra?</label>
                                        <select 
                                            value={selectedMember} 
                                            onChange={e => setSelectedMember(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500"
                                        >
                                            {data.members.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Fecha del Gasto</label>
                                        <input 
                                            type="date" 
                                            value={expenseDate} 
                                            onChange={e => setExpenseDate(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Detalle / Comercio</label>
                                        <input 
                                            type="text" 
                                            placeholder="ej: Supermercado Coto / ARBA"
                                            value={description} 
                                            onChange={e => setDescription(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="flex flex-col justify-end">
                                        <div className="flex items-center gap-3 mb-2">
                                            <input 
                                                type="checkbox" 
                                                id="isInstallment"
                                                checked={isInstallment}
                                                onChange={e => setIsInstallment(e.target.checked)}
                                                className="w-4 h-4 text-indigo-600 rounded"
                                            />
                                            <label htmlFor="isInstallment" className="text-xs font-bold text-slate-700">
                                                ¿Es en cuotas?
                                            </label>
                                        </div>
                                        {isInstallment && (
                                            <input 
                                                type="number" 
                                                min="2" 
                                                max="60"
                                                value={totalInstallments}
                                                onChange={e => setTotalInstallments(e.target.value)}
                                                placeholder="Cuotas totales (ej: 3)"
                                                className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                            />
                                        )}
                                    </div>

                                    {activeView !== 'Impuestos' && !isInstallment && (
                                        <div className="md:col-span-3 flex items-center gap-2 pt-1">
                                            <input 
                                                type="checkbox" 
                                                id="isRecurring"
                                                checked={isRecurring}
                                                onChange={e => setIsRecurring(e.target.checked)}
                                                className="w-4 h-4 text-indigo-600 rounded"
                                            />
                                            <label htmlFor="isRecurring" className="text-xs text-slate-600">
                                                Gasto Fijo mensual (se mantiene al renovar mes)
                                            </label>
                                        </div>
                                    )}

                                    <div className="md:col-span-3 mt-2">
                                        <button 
                                            type="submit" 
                                            disabled={saving}
                                            className={`w-full text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-sm disabled:opacity-50 ${editingId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                        >
                                            {saving ? 'Guardando...' : (editingId ? '💾 Actualizar Movimiento' : `+ Registrar en ${activeView}`)}
                                        </button>
                                    </div>
                                </form>
                            </div>

                            {/* Buscador específico de la sección */}
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                <input 
                                    type="text" 
                                    placeholder={`🔍 Filtrar movimientos en ${activeView} (por detalle, monto, fecha o integrante)...`} 
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>

                            {/* Listado con Editar y Eliminar */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                    <h3 className="font-bold text-slate-700 text-sm">Movimientos en {activeView}</h3>
                                    <span className="text-xs text-slate-500">
                                        {filteredExpenses.length} registros
                                    </span>
                                </div>
                                {filteredExpenses.length === 0 ? (
                                    <div className="p-8 text-center text-slate-400 text-sm">No se encontraron movimientos.</div>
                                ) : (
                                    <div className="divide-y divide-slate-100">
                                        {filteredExpenses.map(item => (
                                            <div key={item.id} className={`p-4 flex flex-wrap justify-between items-center gap-3 transition ${editingId === item.id ? 'bg-amber-50' : 'hover:bg-slate-50'}`}>
                                                <div>
                                                    <div className="font-semibold text-slate-800 text-sm">{item.description}</div>
                                                    <div className="flex flex-wrap gap-2 mt-1 items-center">
                                                        <span className="text-[11px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-medium">{item.member}</span>
                                                        <span className="text-[11px] text-slate-400">{item.date}</span>
                                                        {item.totalInstallments > 1 && (
                                                            <span className="text-[11px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">
                                                                Cuota {item.currentInstallment} de {item.totalInstallments}
                                                            </span>
                                                        )}
                                                        {(item.isRecurring || activeView === 'Impuestos') && (
                                                            <span className="text-[11px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded">
                                                                Fijo / Recurrente
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-slate-900 text-base mr-2">${item.amount.toLocaleString('es-AR')}</span>
                                                    <button 
                                                        onClick={() => handleStartEdit(item)}
                                                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2.5 py-1.5 rounded transition flex items-center gap-1"
                                                    >
                                                        ✏️ Editar
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteExpense(item.id, item.description)}
                                                        className="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-2.5 py-1.5 rounded transition flex items-center gap-1"
                                                    >
                                                        🗑️ Eliminar
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* VISTA: AJUSTES */}
                    {activeView === 'settings' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-4">Configurar Sueldo y Cobro</h3>
                                <form onSubmit={handleSaveSalaryForm} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Monto de Sueldo ($)</label>
                                        <input 
                                            type="number" 
                                            value={newSalary} 
                                            onChange={e => setNewSalary(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Próxima Fecha de Cobro</label>
                                        <input 
                                            type="date" 
                                            value={newPayDate} 
                                            onChange={e => setNewPayDate(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                        />
                                    </div>
                                    <div className="flex items-end">
                                        <button 
                                            type="submit" 
                                            disabled={saving}
                                            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 px-4 rounded-lg text-sm disabled:opacity-50"
                                        >
                                            Guardar Sueldo
                                        </button>
                                    </div>
                                </form>
                            </div>

                            {/* Tarjetas */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-2">💳 Gestionar Tarjetas</h3>
                                <div className="space-y-2 mb-4">
                                    {data.cards.map(c => (
                                        <div key={c.name} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm">
                                            <div>
                                                <span className="font-bold text-slate-800">{c.name}</span>
                                                <span className={`ml-2 text-xs px-2 py-0.5 rounded ${c.isCredit ? 'bg-purple-100 text-purple-700' : 'bg-slate-200 text-slate-700'}`}>
                                                    {c.isCredit ? 'Crédito (+ 1.2% Sello)' : 'Débito'}
                                                </span>
                                            </div>
                                            <button onClick={() => handleRemoveCard(c.name)} className="text-red-500 text-xs font-semibold px-2 py-1">Eliminar</button>
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={handleAddCard} className="flex flex-wrap gap-2 items-end pt-2 border-t border-slate-100">
                                    <div className="flex-1 min-w-[200px]">
                                        <label className="block text-xs font-medium text-slate-500 mb-1">Nueva Tarjeta</label>
                                        <input 
                                            type="text" 
                                            placeholder="ej: Visa Galicia"
                                            value={newCardName}
                                            onChange={e => setNewCardName(e.target.value)}
                                            className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">¿Lleva Imp. Sello (1,2%)?</label>
                                        <select 
                                            value={newCardIsCredit}
                                            onChange={e => setNewCardIsCredit(e.target.value === 'true')}
                                            className="border border-slate-300 rounded-lg p-2 text-sm bg-white outline-none"
                                        >
                                            <option value="true">Sí (Crédito)</option>
                                            <option value="false">No (Débito)</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg text-sm">+ Agregar</button>
                                </form>
                            </div>

                            {/* Integrantes */}
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-2">👥 Integrantes</h3>
                                <div className="space-y-2 mb-4">
                                    {data.members.map((m, idx) => (
                                        <div key={m} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm">
                                            <div>
                                                <span className="font-bold text-slate-800">{m}</span>
                                                {idx === 0 && <span className="ml-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded">Principal (Sueldo)</span>}
                                            </div>
                                            {idx > 0 && <button onClick={() => handleRemoveMember(m)} className="text-red-500 text-xs font-semibold px-2 py-1">Eliminar</button>}
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={handleAddMember} className="flex gap-2 items-end pt-2 border-t border-slate-100">
                                    <input 
                                        type="text" 
                                        placeholder="Nombre del integrante"
                                        value={newMemberName}
                                        onChange={e => setNewMemberName(e.target.value)}
                                        className="flex-1 border border-slate-300 rounded-lg p-2 text-sm outline-none"
                                    />
                                    <button type="submit" className="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg text-sm">+ Agregar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
